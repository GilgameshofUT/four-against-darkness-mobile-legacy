<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#221c14"/>
      <stop offset="1" stop-color="#0e0c08"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#e8b45c" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#c99a44" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c99a44" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#f7dfa6"/>
      <stop offset="0.45" stop-color="#f4d18a"/>
      <stop offset="1" stop-color="#cf9a41"/>
    </linearGradient>
    <linearGradient id="flameCore" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fff5da"/>
      <stop offset="1" stop-color="#f4d18a"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a3a"/>
      <stop offset="1" stop-color="#5b431f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed ground for maskable safe zone -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- glyph scaled to ~60% so it survives any mask -->
  <g transform="translate(256,256) scale(0.62) translate(-256,-256)">
    <circle cx="256" cy="244" r="176" fill="url(#glow)"/>
    <path d="M256 96 C 306 176, 342 224, 330 288 C 320 342, 290 372, 256 372 C 222 372, 192 342, 182 288 C 170 224, 206 176, 256 96 Z"
          fill="url(#flame)"/>
    <path d="M256 190 C 284 244, 300 270, 292 302 C 285 330, 272 346, 256 346 C 240 346, 227 330, 220 302 C 212 270, 228 244, 256 190 Z"
          fill="url(#flameCore)"/>
    <path d="M240 360 h32 l7 92 a23 23 0 0 1 -46 0 Z" fill="url(#wood)"/>
    <rect x="232" y="352" width="48" height="20" rx="7" fill="#6c4d1c"/>
    <circle cx="176" cy="196" r="7" fill="#f4d18a" opacity="0.8"/>
    <circle cx="338" cy="168" r="5" fill="#f4d18a" opacity="0.7"/>
  </g>
</svg>
